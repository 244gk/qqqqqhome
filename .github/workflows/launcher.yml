name: launcher

# Release, started by hand (Actions → launcher → Run workflow on main): build, lint, unit and screenshot tests, signing check,
# then publish the Release. The emulator demo is a separate workflow (demo.yml), run only when wanted.
on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # Publish a GitHub Release (the head unit's "check for updates" reads from here). Only from main.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, for the release notes
      - uses: actions/download-artifact@v4
        with:
          name: q5home-apk
          path: apk
      - name: Name the APK, write release notes
        run: |
          mv apk/app-release.apk "apk/q5home-${{ needs.build.outputs.version }}.apk"
          # Copy with a fixed file name: the README's "download latest" link releases/latest/download/q5home.apk always points to it.
          cp "apk/q5home-${{ needs.build.outputs.version }}.apk" apk/q5home.apk
          # Release notes = the commits since the previous release (one line each; wallpaper-feed commits left out),
          # shown on the head unit's "version update" page. The first release uses the last commit message.
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$prev" ]; then
            git log "$prev..HEAD" --format='- %s' | grep -v -E '^- Wallpaper feed:' > notes.md || true
          fi
          [ -s notes.md ] || git log -1 --format=%B | grep -v -E '^Co-Authored-By:' > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: q5home ${{ needs.build.outputs.version }}
          body_path: notes.md
          files: |
            apk/q5home-${{ needs.build.outputs.version }}.apk
            apk/q5home.apk
          make_latest: true
